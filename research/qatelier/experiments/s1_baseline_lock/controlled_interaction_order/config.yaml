schema_version: 1
artifact_id: qatelier-s1-controlled-interaction-order
status: generated_reproducible_definition
purpose: >-
  Mechanism benchmark for measuring how classical and quantum adapter
  performance changes as the latent target interaction order increases.
canonical_generator: research.qatelier.benchmark.make_interaction_problem
feature_space:
  n_features: 6
  distribution: standard_normal
  observation_noise_std: 0.0
  label_noise: 0.0
  threshold: 0.0
  label_rule: "1 if latent_score >= threshold, otherwise 0"
target:
  orders: [1, 2, 3, 4, 5, 6]
  problem_seed_formula: "314159 + 100 * order + family_index"
  families:
    - name: aligned_polynomial
      canonical_family: aligned
      description: "Product of the first k coordinates."
      family_index: 0
    - name: rotated_polynomial
      canonical_family: rotated
      description: "Product of the first k coordinates after one frozen orthogonal rotation."
      family_index: 1
    - name: misaligned_dense
      canonical_family: misaligned
      description: "Product of k dense, normalized random projections."
      family_index: 2
    - name: fourier_trigonometric
      canonical_family: fourier
      description: "Product of k fixed sinusoidal factors with frequencies 1–3."
      family_index: 3
splits:
  train_selection_seeds: [11, 13, 17]
  confirmation_seeds: [101, 103, 107, 109, 113]
  budgets_per_class: [16, 32, 64, 128, 256]
  max_train_rows_per_class: 256
  confirmation_rows_per_class: 256
  sampling_block_size: 4096
  balancing: >-
    Draw deterministic standard-normal candidates until exactly the first
    256 rows of each class are collected; store class-0 rows followed by
    class-1 rows. Train budgets are prefixes within each class. Confirmation
    rows are never used for fitting, selection, or compressor fitting.
  threshold_is_frozen_before_sampling: true
  split_target_is_shared_across_seeds: true
  split_overlap_check: exact_feature_and_label_hashes
artifact:
  data_file: data/controlled_interaction_order.npz
  manifest_file: manifest.json
  validation_file: validation.json
  array_hash_algorithm: sha256(dtype, shape, contiguous_bytes)
  split_hash_algorithm: sha256(dtype, shape, contiguous_bytes)
  providers_contacted: false
  jobs_submitted: 0

