name: Test

on:
  push:
    branches: [master, qatelier]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install declared test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,qatelier-core,qatelier-dev]"
          python -m pip install -e "atelier_agent[dev]"

      - name: Run full test suite
        run: python -m pytest -q

      - name: Run QAtelier tests explicitly
        run: python -m pytest research/qatelier/tests -q

      - name: Run credential-free QAtelier validation and smoke
        run: |
          python -m research.qatelier.cli validate --structure-only --json
          python -m research.qatelier.cli hardware-preflight --json
          python -m research.qatelier.cli smoke --output "$RUNNER_TEMP/qatelier-smoke.json"

      - name: Run repository checks
        run: |
          python scripts/check_repo.py
          python scripts/validate_experiments.py

  macos-smoke:
    name: macOS runtime smoke
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Atelier runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "atelier_agent[dev]"

      - name: Run model-free Apple Silicon smoke
        env:
          ATELIER_HOME: ${{ runner.temp }}/Atelier
        run: |
          python -m compileall -q atelier_agent/atelier atelier_agent/agent atelier_agent/tools
          python -m pytest -q \
            atelier_agent/tests/test_runtime.py \
            atelier_agent/tests/test_workspace.py \
            atelier_agent/tests/test_security.py \
            atelier_agent/tests/test_workflow_engine.py
