name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Ruff needs no project dependencies, so this job stays fast and gives a
      # style/dead-code signal well before the heavier test job finishes.
      - name: Install Ruff
        run: python -m pip install ruff==0.15.17

      - name: Check lint rules
        run: ruff check atelier_agent foundation scripts

      - name: Check import sorting and formatting drift
        run: ruff check --select I atelier_agent foundation scripts

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install declared test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install -e "atelier_agent[dev]"

      - name: Run full test suite
        run: python -m pytest -q

      - name: Run repository checks
        run: |
          python scripts/check_repo.py
          python scripts/validate_experiments.py

  macos-smoke:
    name: macOS runtime smoke
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Atelier runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "atelier_agent[dev]"

      - name: Run model-free Apple Silicon smoke
        env:
          ATELIER_HOME: ${{ runner.temp }}/Atelier
        run: |
          python -m compileall -q atelier_agent/atelier atelier_agent/agent atelier_agent/tools
          python -m pytest -q \
            atelier_agent/tests/test_runtime.py \
            atelier_agent/tests/test_workspace.py \
            atelier_agent/tests/test_security.py \
            atelier_agent/tests/test_workflow_engine.py
