<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Atelier terminal interface</title>
  <desc id="desc">A light, editorial terminal mockup showing the Atelier prompt, a paper question, retrieved evidence, and a cited answer.</desc>
  <rect width="1200" height="680" rx="10" fill="#f4f3f0"/>
  <text x="70" y="64" fill="#797a80" font-family="IBM Plex Mono, SFMono-Regular, monospace" font-size="13" letter-spacing="2">THE ATELIER LAB  /  INTERFACE</text>
  <text x="70" y="112" fill="#16171d" font-family="Newsreader, Georgia, serif" font-size="38">A calm terminal for serious work.</text>
  <text x="70" y="143" fill="#4c4c54" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16">The daily interface stays small: navigate, ingest, search, ask, build.</text>

  <rect x="70" y="185" width="1060" height="410" rx="5" fill="#fbfaf7" stroke="#d8d9dd"/>
  <line x1="70" y1="225" x2="1130" y2="225" stroke="#d8d9dd"/>
  <circle cx="94" cy="205" r="5" fill="#d8d9dd"/><circle cx="112" cy="205" r="5" fill="#d8d9dd"/><circle cx="130" cy="205" r="5" fill="#d8d9dd"/>
  <text x="600" y="210" text-anchor="middle" fill="#797a80" font-family="IBM Plex Mono, SFMono-Regular, monospace" font-size="12">atelier — local research workbench</text>

  <g font-family="IBM Plex Mono, SFMono-Regular, monospace">
    <text x="98" y="266" fill="#6457c1" font-size="14">atelier ›</text>
    <text x="185" y="266" fill="#16171d" font-size="14">ask --show-context "What are the main risks in the plan?"</text>
    <text x="98" y="294" fill="#797a80" font-size="12">retrieving evidence from the local library ...</text>

    <rect x="98" y="318" width="1004" height="92" rx="3" fill="#f4f3f0" stroke="#d8d9dd"/>
    <text x="118" y="345" fill="#483a9a" font-size="12">[1] QAtelier_Research_Plan.docx · heading: Risks</text>
    <text x="118" y="371" fill="#4c4c54" font-size="12">The claim depends on matched baselines, repeated trials, and hardware-aware measurements.</text>
    <text x="118" y="394" fill="#797a80" font-size="12">Evidence is retained with its document location for review.</text>

    <rect x="98" y="430" width="1004" height="112" rx="3" fill="#e8e8ff" stroke="#bcb7e4"/>
    <text x="118" y="458" fill="#483a9a" font-size="12">Answer</text>
    <text x="118" y="486" fill="#16171d" font-size="12">The main risks are confounding, weak baselines, insufficient repetitions, and over-interpreting</text>
    <text x="118" y="508" fill="#16171d" font-size="12">noisy hardware results [1]. Verify the table values before making a research claim.</text>
    <text x="118" y="531" fill="#797a80" font-size="11">Sources: QAtelier_Research_Plan.docx · heading: Risks</text>
  </g>

  <text x="70" y="633" fill="#4c4c54" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14">Tab completes paths. Ctrl-C cancels a child command. Resize the window and the layout follows.</text>
</svg>
