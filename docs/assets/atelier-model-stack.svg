<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Atelier model roles</title>
  <desc id="desc">A calm four-row model role diagram showing worker, coding agent, reserved main local intelligence, and frontier handoffs.</desc>
  <rect width="1200" height="520" rx="10" fill="#fbfaf7"/>
  <text x="70" y="64" fill="#797a80" font-family="IBM Plex Mono, SFMono-Regular, monospace" font-size="13" letter-spacing="2">THE ATELIER LAB  /  MODEL ROLES</text>
  <text x="70" y="112" fill="#16171d" font-family="Newsreader, Georgia, serif" font-size="38">A small stack with distinct jobs.</text>
  <text x="70" y="143" fill="#4c4c54" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16">Models are assigned by capability, memory budget, and measured need.</text>

  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <rect x="70" y="190" width="1060" height="62" rx="4" fill="#f4f3f0" stroke="#d8d9dd"/>
    <rect x="70" y="190" width="5" height="62" fill="#6457c1"/>
    <text x="94" y="216" fill="#6457c1" font-family="IBM Plex Mono, SFMono-Regular, monospace" font-size="11" letter-spacing="1.2">A  /  WORKER</text>
    <text x="94" y="238" fill="#16171d" font-family="Newsreader, Georgia, serif" font-size="22">LFM2.5 · 2.6B · 2.2 GB</text>
    <text x="430" y="226" fill="#4c4c54" font-size="14">routing · extraction · query rewriting · structured subtasks</text>

    <rect x="70" y="265" width="1060" height="62" rx="4" fill="#f4f3f0" stroke="#d8d9dd"/>
    <rect x="70" y="265" width="5" height="62" fill="#6457c1"/>
    <text x="94" y="291" fill="#6457c1" font-family="IBM Plex Mono, SFMono-Regular, monospace" font-size="11" letter-spacing="1.2">B  /  CODING AGENT</text>
    <text x="94" y="313" fill="#16171d" font-family="Newsreader, Georgia, serif" font-size="22">Qwen3 · 8B · 5.2 GB</text>
    <text x="430" y="301" fill="#4c4c54" font-size="14">repository exploration · edits · scripts · tests</text>

    <rect x="70" y="340" width="1060" height="62" rx="4" fill="#e8e8ff" stroke="#bcb7e4"/>
    <rect x="70" y="340" width="5" height="62" fill="#483a9a"/>
    <text x="94" y="366" fill="#483a9a" font-family="IBM Plex Mono, SFMono-Regular, monospace" font-size="11" letter-spacing="1.2">C  /  RESERVED</text>
    <text x="94" y="388" fill="#16171d" font-family="Newsreader, Georgia, serif" font-size="22">Qwen3.8-27B · Q4-class</text>
    <text x="500" y="376" fill="#4c4c54" font-size="14">papers · mathematics · quantum · private synthesis · evaluation first</text>

    <rect x="70" y="415" width="1060" height="62" rx="4" fill="#f4f3f0" stroke="#d8d9dd"/>
    <rect x="70" y="415" width="5" height="62" fill="#16171d"/>
    <text x="94" y="441" fill="#4c4c54" font-family="IBM Plex Mono, SFMono-Regular, monospace" font-size="11" letter-spacing="1.2">D  /  FRONTIER</text>
    <text x="94" y="463" fill="#16171d" font-family="Newsreader, Georgia, serif" font-size="22">Claude · Codex · Gemini</text>
    <text x="500" y="451" fill="#4c4c54" font-size="14">critic · implementation · large-context and multimodal review</text>
  </g>
</svg>
