<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Atelier coding workflow</title>
  <desc id="desc">A five-step coding workflow: attach a workspace, inspect the repository, choose an agent workflow, run tests, and review the certificate.</desc>
  <rect width="1200" height="500" rx="10" fill="#f4f3f0"/>
  <text x="70" y="62" fill="#797a80" font-family="IBM Plex Mono, SFMono-Regular, monospace" font-size="13" letter-spacing="2">ATELIER  /  BUILD LOOP</text>
  <text x="70" y="110" fill="#16171d" font-family="Newsreader, Georgia, serif" font-size="38">Use the agent as an engineer, not a magic wand.</text>
  <text x="70" y="141" fill="#4c4c54" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16">Start with deterministic repository facts, then make the smallest verifiable change.</text>
  <line x1="70" y1="175" x2="1130" y2="175" stroke="#d8d9dd"/>

  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <rect x="70" y="220" width="185" height="112" rx="4" fill="#fbfaf7" stroke="#d8d9dd"/>
    <text x="92" y="248" fill="#6457c1" font-family="IBM Plex Mono, SFMono-Regular, monospace" font-size="12">01  ATTACH</text>
    <text x="92" y="279" fill="#16171d" font-family="Newsreader, Georgia, serif" font-size="22">Choose a root</text>
    <text x="92" y="307" fill="#4c4c54" font-size="13">read / write / execute</text>

    <rect x="280" y="220" width="185" height="112" rx="4" fill="#fbfaf7" stroke="#d8d9dd"/>
    <text x="302" y="248" fill="#6457c1" font-family="IBM Plex Mono, SFMono-Regular, monospace" font-size="12">02  INSPECT</text>
    <text x="302" y="279" fill="#16171d" font-family="Newsreader, Georgia, serif" font-size="22">Map the repo</text>
    <text x="302" y="307" fill="#4c4c54" font-size="13">files · tests · Git · symbols</text>

    <rect x="490" y="220" width="185" height="112" rx="4" fill="#fbfaf7" stroke="#d8d9dd"/>
    <text x="512" y="248" fill="#6457c1" font-family="IBM Plex Mono, SFMono-Regular, monospace" font-size="12">03  CHANGE</text>
    <text x="512" y="279" fill="#16171d" font-family="Newsreader, Georgia, serif" font-size="22">Pick the workflow</text>
    <text x="512" y="307" fill="#4c4c54" font-size="13">agent or constrained code-fix</text>

    <rect x="700" y="220" width="185" height="112" rx="4" fill="#fbfaf7" stroke="#d8d9dd"/>
    <text x="722" y="248" fill="#6457c1" font-family="IBM Plex Mono, SFMono-Regular, monospace" font-size="12">04  TEST</text>
    <text x="722" y="279" fill="#16171d" font-family="Newsreader, Georgia, serif" font-size="22">Prove the diff</text>
    <text x="722" y="307" fill="#4c4c54" font-size="13">regression tests + review</text>

    <rect x="910" y="220" width="220" height="112" rx="4" fill="#e8e8ff" stroke="#bcb7e4"/>
    <text x="932" y="248" fill="#483a9a" font-family="IBM Plex Mono, SFMono-Regular, monospace" font-size="12">05  HAND OFF</text>
    <text x="932" y="279" fill="#16171d" font-family="Newsreader, Georgia, serif" font-size="22">Read the certificate</text>
    <text x="932" y="307" fill="#4c4c54" font-size="13">what changed · what passed</text>
  </g>
  <g stroke="#b5b6bc" stroke-width="1.5" fill="none"><path d="M255 276 H275"/><path d="M465 276 H485"/><path d="M675 276 H695"/><path d="M885 276 H905"/></g>
  <g fill="#6457c1"><circle cx="265" cy="276" r="3"/><circle cx="475" cy="276" r="3"/><circle cx="685" cy="276" r="3"/><circle cx="895" cy="276" r="3"/></g>
  <rect x="70" y="385" width="1060" height="66" rx="3" fill="#fbfaf7" stroke="#d8d9dd"/>
  <text x="90" y="413" fill="#16171d" font-family="IBM Plex Mono, SFMono-Regular, monospace" font-size="12">repo inspect → repo tests → agent / code-fix → test → diff review</text>
  <text x="90" y="435" fill="#797a80" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13">The workspace boundary limits where the agent can read, write, and execute.</text>
</svg>
